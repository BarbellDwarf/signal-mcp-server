name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  publish-npm:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Node 22: npm@latest (12.x) dropped Node 20 support, and the OIDC publish
    # needs a current npm. Node 22 is already in the CI test matrix.
    permissions:
      contents: read
      # OIDC token for npm trusted publishing (no long-lived NPM_TOKEN secret).
      id-token: write
    # Publishing relies on a trusted publisher configured on npmjs.com for
    # signal-api-mcp: repository BarbellDwarf/signal-mcp-server, workflow
    # publish.yml. GitHub Packages npm rejected as mirror because it requires
    # scoped names.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upgrade npm for trusted publishing
        # Bundled npm on the runner is older than the OIDC-publish support and
        # its engine fixes. npm 11.5.1+ authenticates the publish with the
        # workflow's OIDC token and attaches a provenance attestation.
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --provenance

  publish-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/barbelldwarf/signal-mcp-server:${{ github.ref_name }}
            ghcr.io/barbelldwarf/signal-mcp-server:latest
